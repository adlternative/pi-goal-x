<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game">
      <header class="hud">
        <h1>Snake</h1>
        <p class="score">Score: <span id="score">0</span></p>
      </header>
      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
      <p id="status" class="status" role="status">Arrow keys or WASD to move</p>
      <button type="button" id="restart" class="restart hidden">Play again</button>
    </main>
    <script src="game.js"></script>
  </body>
</html>
